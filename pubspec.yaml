name: koinly
description: Flutter rebuild of the Koinly personal finance tracker with adaptive Material 3 UI for Android, Windows, Linux, and macOS.
publish_to: "none"
version: 1.0.1113+157
environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.4.2
  sqlite3: ^3.0.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  intl: ^0.20.3
  uuid: ^4.5.1
  fl_chart: ^0.69.0
  lottie: ^3.5.1
  timelines_plus: ^2.0.1
  flutter_spinkit: ^5.2.2
  awesome_snackbar_content: ^0.1.8
  flutter_slidable: ^4.0.3
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  flutter_local_notifications: ^17.2.3
  workmanager: ^0.10.10
  flutter_secure_storage: ^10.3.1
  http: ^1.2.2
  mongo_dart: ^0.10.9
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  video_player_win: ^3.1.1
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
