# Self-hosted Koinly Sync Worker configuration.
# GitHub Actions overrides this local fallback with CLOUDFLARE_NAME.
name = "koinly-sync-worker"
main = "src/index.ts"
compatibility_date = "2026-08-21"
workers_dev = true

[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "SyncHub"

[[migrations]]
tag = "v1-realtime-sync-hub"
new_sqlite_classes = ["SyncHub"]

[vars]
KOINLY_WORKER_VERSION = "1.0.1166"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "2592000"
MAX_SYNC_BATCH_SIZE = "100"
MAX_SYNC_REPLACE_SIZE = "25000"

# Set these as Cloudflare Worker secrets, not committed vars:
# wrangler secret put TURSO_DATABASE_URL
# wrangler secret put TURSO_AUTH_TOKEN
# wrangler secret put JWT_SECRET

# Check automatic Analytics report uploads and optional Telegram .koinlybackup schedules every five minutes.
[triggers]
crons = ["*/5 * * * *"]
