name: Build Android, Windows, Linux and macOS Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "lib/**"
      - "android/**"
      - "windows/**"
      - "linux/**"
      - "macos/**"
      - "tools/linux/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "CHANGELOG.md"
      - ".github/workflows/build-android-apks.yml"

concurrency:
  group: koinly-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub copies workflow triggers into forks. Keep every release build job
  # restricted to the canonical repository so fork pushes and manual runs
  # cannot spend Actions minutes building Koinly application packages.
  build-apks:
    name: Build ARM32, ARM64, and universal APKs
    if: github.repository == 'Chowdhury-Siam/Koinly'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4g"
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 36 and NDK 28
        shell: bash
        run: |
          packages=()
          [ -d "$ANDROID_HOME/platforms/android-36" ] || packages+=("platforms;android-36")
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || packages+=("build-tools;36.0.0")
          [ -d "$ANDROID_HOME/ndk/28.2.13676358" ] || packages+=("ndk;28.2.13676358")
          if [ ${#packages[@]} -gt 0 ]; then
            echo "Installing missing Android SDK packages: ${packages[*]}"
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "${packages[@]}"
          else
            echo "Required Android SDK/NDK packages are already available on the runner."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: .pub-cache
          key: koinly-${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            koinly-${{ runner.os }}-pub-

      - name: Restore Android Gradle wrapper without replacing app resources
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SOURCE="$RUNNER_TEMP/koinly-android-source"
          WRAPPER_SOURCE="$RUNNER_TEMP/koinly-generated-wrapper"
          rm -rf "$ANDROID_SOURCE" "$WRAPPER_SOURCE"

          # flutter create is used only to regenerate binary Gradle wrapper files that are
          # intentionally not kept in the source ZIP. Preserve the complete Android app
          # first so Flutter cannot silently replace the custom launcher/splash resources.
          cp -a android "$ANDROID_SOURCE"
          flutter create --platforms=android --project-name koinly --no-pub .

          mkdir -p "$WRAPPER_SOURCE"
          cp android/gradlew "$WRAPPER_SOURCE/gradlew"
          cp android/gradlew.bat "$WRAPPER_SOURCE/gradlew.bat"
          cp -a android/gradle/wrapper "$WRAPPER_SOURCE/wrapper"

          rm -rf android
          cp -a "$ANDROID_SOURCE" android
          cp "$WRAPPER_SOURCE/gradlew" android/gradlew
          cp "$WRAPPER_SOURCE/gradlew.bat" android/gradlew.bat
          mkdir -p android/gradle
          rm -rf android/gradle/wrapper
          cp -a "$WRAPPER_SOURCE/wrapper" android/gradle/wrapper
          chmod +x android/gradlew

          # Fail immediately if the dedicated splash configuration was lost.
          grep -q '@drawable/koinly_splash_icon' android/app/src/main/res/values-v31/styles.xml
          test -f android/app/src/main/res/drawable-nodpi/koinly_splash_icon.png

      - name: Force Gradle wrapper 8.14.1
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF_GRADLE'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.1-bin.zip
          EOF_GRADLE

      - name: Read app version
        run: |
          FULL_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          VERSION_NAME="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION##*+}"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pubspec.yaml version must use semantic-version+positive-build-number, for example 1.2.3+123."
            exit 1
          fi
          echo "KOINLY_APP_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "KOINLY_APP_BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${BUILD_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -nE "^(version:)|versionCode|versionName" pubspec.yaml android/app/build.gradle

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare artifact folder
        run: mkdir -p artifacts

      - name: Prepare permanent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Permanent Android release signing is required. Missing GitHub Actions secrets: ${missing[*]}"
            echo "::error::The workflow will not generate a temporary signing key because changing signing certificates prevents normal app updates."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/koinly-release.jks"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Encode the same permanent Koinly .jks/.keystore file and update the repository secret."
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded Android keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            rm -f "$KEYSTORE_FILE"
            exit 1
          fi

          chmod 600 "$KEYSTORE_FILE"
          if ! keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null; then
            echo "::error::Android release keystore validation failed. Check the keystore, password, and alias secrets."
            exit 1
          fi

          echo "Using the configured permanent Android release key."
          keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | grep -E 'SHA256:|Alias name:' || true

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build universal APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm,android-arm64 \
            --build-name="$KOINLY_APP_VERSION_NAME" \
            --build-number="$KOINLY_APP_BUILD_NUMBER" \
            --no-pub \
            --no-tree-shake-icons \
            --dart-define=KOINLY_APP_VERSION="$KOINLY_APP_VERSION_NAME"
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/Koinly-v${KOINLY_APP_VERSION_NAME}-universal.apk"

      - name: Build ARM32 and ARM64 split APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name="$KOINLY_APP_VERSION_NAME" \
            --build-number="$KOINLY_APP_BUILD_NUMBER" \
            --no-pub \
            --no-tree-shake-icons \
            --dart-define=KOINLY_APP_VERSION="$KOINLY_APP_VERSION_NAME"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "artifacts/Koinly-v${KOINLY_APP_VERSION_NAME}-arm32.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "artifacts/Koinly-v${KOINLY_APP_VERSION_NAME}-arm64.apk"

      - name: List APK artifacts
        run: ls -lh artifacts

      - name: Verify APK signatures
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::warning::apksigner was not found at $APKSIGNER; skipping signature verification."
            exit 0
          fi
          for apk in artifacts/*.apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload release APKs
        uses: actions/upload-artifact@v5
        with:
          name: koinly-android-release-assets
          path: artifacts/*.apk
          if-no-files-found: error
          compression-level: 0

  build-windows:
    name: Build Windows x64 installer EXE
    if: github.repository == 'Chowdhury-Siam/Koinly'
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      PUB_CACHE: ${{ github.workspace }}\.pub-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Restore Windows dependency cache
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            build/windows/x64/extracted
          key: koinly-${{ runner.os }}-deps-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            koinly-${{ runner.os }}-deps-

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --project-name koinly --no-pub .

      - name: Apply Koinly Windows window title
        shell: pwsh
        run: |
          $mainCpp = "windows/runner/main.cpp"
          if (!(Test-Path $mainCpp)) {
            throw "Windows runner main.cpp was not generated: $mainCpp"
          }
          $main = Get-Content $mainCpp -Raw
          $main = $main -replace 'CreateAndShow\(L"[^"]+"', 'CreateAndShow(L"Koinly"'
          $main = $main -replace '\.Create\(L"[^"]+"', '.Create(L"Koinly"'
          Set-Content -Path $mainCpp -Value $main -Encoding UTF8

          $resourceRc = "windows/runner/Runner.rc"
          if (Test-Path $resourceRc) {
            $rc = Get-Content $resourceRc -Raw
            $rc = $rc -replace 'VALUE "FileDescription", "[^"]+"', 'VALUE "FileDescription", "Koinly"'
            $rc = $rc -replace 'VALUE "InternalName", "[^"]+"', 'VALUE "InternalName", "Koinly"'
            $rc = $rc -replace 'VALUE "OriginalFilename", "[^"]+"', 'VALUE "OriginalFilename", "Koinly.exe"'
            $rc = $rc -replace 'VALUE "ProductName", "[^"]+"', 'VALUE "ProductName", "Koinly"'
            Set-Content -Path $resourceRc -Value $rc -Encoding UTF8
          }

      - name: Apply Koinly Windows app icon
        shell: pwsh
        run: |
          $iconSource = "assets/icons/app_icon.ico"
          $iconDest = "windows/runner/resources/app_icon.ico"
          if (!(Test-Path $iconSource)) {
            throw "Windows icon source was not found: $iconSource"
          }
          if (!(Test-Path "windows/runner/resources")) {
            New-Item -ItemType Directory -Force "windows/runner/resources" | Out-Null
          }
          Copy-Item -Path $iconSource -Destination $iconDest -Force
          if (!(Test-Path $iconDest)) {
            throw "Windows icon was not copied: $iconDest"
          }

      - name: Read app version
        shell: pwsh
        run: |
          $versionLine = Get-Content "pubspec.yaml" | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $fullVersion = ($versionLine -replace '^version:\s*', '').Trim()
          $parts = $fullVersion -split '\+', 2
          if ($parts.Count -ne 2 -or $parts[0] -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' -or $parts[1] -notmatch '^[1-9]\d*$') {
            throw "pubspec.yaml version must use semantic-version+positive-build-number, for example 1.2.3+123."
          }
          $versionName = $parts[0]
          $buildNumber = $parts[1]
          "KOINLY_APP_VERSION_NAME=$versionName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KOINLY_APP_BUILD_NUMBER=$buildNumber" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Select-String -Path "pubspec.yaml" -Pattern "^version:"

      - name: Patch Windows CMake for CMake 4/Firebase compatibility
        shell: pwsh
        run: |
          $cmakeFile = "windows/CMakeLists.txt"
          if (!(Test-Path $cmakeFile)) {
            throw "Windows CMakeLists.txt was not generated: $cmakeFile"
          }

          $content = Get-Content $cmakeFile -Raw
          if ($content -notmatch "CMAKE_POLICY_VERSION_MINIMUM") {
            $lines = Get-Content $cmakeFile
            $patched = New-Object System.Collections.Generic.List[string]
            $inserted = $false

            foreach ($line in $lines) {
              $patched.Add($line)
              if (!$inserted -and $line -match "^cmake_minimum_required\(VERSION") {
                $patched.Add("")
                $patched.Add("# Firebase's bundled Windows C++ SDK still declares an older CMake policy.")
                $patched.Add("# CMake 4 rejects that by default, so keep policy compatibility at 3.5.")
                $patched.Add('set(CMAKE_POLICY_VERSION_MINIMUM 3.5 CACHE STRING "Minimum CMake policy version for legacy Firebase C++ SDK")')
                $patched.Add("")
                $patched.Add("# Older Flutter Windows plugins can include MSVC's deprecated experimental coroutine header.")
                $patched.Add("# Visual Studio 2026/MSVC 14.51 treats that as a hard error unless this macro is defined.")
                $patched.Add('add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)')
                $patched.Add("")
                $inserted = $true
              }
            }

            Set-Content -Path $cmakeFile -Value $patched -Encoding UTF8
          }

          Get-Content $cmakeFile -TotalCount 24

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare optional Windows code signing
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) {
            Write-Host "::warning::WINDOWS_CODESIGN_PFX_BASE64 is not configured. The installer will build unsigned, and Microsoft Defender SmartScreen can still show 'Windows protected your PC'."
            "WINDOWS_SIGNING_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PASSWORD)) {
            throw "WINDOWS_CODESIGN_PASSWORD is required when WINDOWS_CODESIGN_PFX_BASE64 is configured."
          }

          $timestampUrl = $env:WINDOWS_CODESIGN_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = "http://timestamp.digicert.com"
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if ($null -eq $signtool) {
            throw "signtool.exe was not found in the Windows SDK installation."
          }

          New-Item -ItemType Directory -Force signing | Out-Null
          $certPath = (Join-Path (Resolve-Path "signing").Path "windows-codesign.pfx")
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))

          "WINDOWS_SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_CODESIGN_CERT=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_CODESIGN_TIMESTAMP_URL=$timestampUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows code signing is enabled. SignTool: $($signtool.FullName)"

      - name: Build Windows release
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release --no-pub --dart-define=KOINLY_APP_VERSION="$env:KOINLY_APP_VERSION_NAME"

      - name: Normalize Windows release executable name
        shell: pwsh
        run: |
          $releaseDir = Resolve-Path "build/windows/x64/runner/Release"
          $defaultExe = Join-Path $releaseDir "koinly.exe"
          $namedExe = Join-Path $releaseDir "Koinly.exe"
          if (Test-Path $defaultExe) {
            Move-Item -Path $defaultExe -Destination $namedExe -Force
          }
          if (!(Test-Path $namedExe)) {
            throw "Expected Windows executable was not found: $namedExe"
          }
          Get-ChildItem $releaseDir | Format-Table Name,Length

      - name: Sign Windows app executable if certificate is configured
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ($env:WINDOWS_SIGNING_ENABLED -ne "true") {
            Write-Host "Skipping Windows app signing because WINDOWS_CODESIGN_PFX_BASE64 is not configured."
            exit 0
          }

          $exe = (Resolve-Path "build/windows/x64/runner/Release/Koinly.exe").Path
          & "$env:WINDOWS_SIGNTOOL_PATH" sign /f "$env:WINDOWS_CODESIGN_CERT" /p "$env:WINDOWS_CODESIGN_PASSWORD" /fd SHA256 /tr "$env:WINDOWS_CODESIGN_TIMESTAMP_URL" /td SHA256 "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Failed to sign Koinly.exe" }

          & "$env:WINDOWS_SIGNTOOL_PATH" verify /pa /v "$exe"
          if ($LASTEXITCODE -ne 0) { throw "Koinly.exe signature verification failed" }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          } else {
            Write-Host "Using preinstalled Inno Setup: $iscc"
          }
          if (!(Test-Path $iscc)) {
            throw "ISCC.exe was not found: $iscc"
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer EXE
        shell: pwsh
        run: |
          $releaseDir = Resolve-Path "build/windows/x64/runner/Release"
          if (!(Test-Path $releaseDir)) {
            throw "Windows release directory was not found: $releaseDir"
          }

          $namedExe = Join-Path $releaseDir "Koinly.exe"
          if (!(Test-Path $namedExe)) {
            throw "Expected Windows executable was not found before installer packaging: $namedExe"
          }

          New-Item -ItemType Directory -Force artifacts | Out-Null
          $sourceDir = $releaseDir.Path
          $outputDir = (Resolve-Path "artifacts").Path
          $iconFile = (Resolve-Path "assets/icons/app_icon.ico").Path
          $pubspecVersionLine = (Get-Content "pubspec.yaml" | Where-Object { $_ -match "^version:" } | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($pubspecVersionLine)) {
            throw "pubspec.yaml version was not found."
          }
          $fullAppVersion = ($pubspecVersionLine -replace "^version:\s*", "").Trim()
          $appVersionName = ($fullAppVersion -split "\+")[0]
          if ([string]::IsNullOrWhiteSpace($appVersionName)) {
            throw "Could not parse installer version from pubspec.yaml version: $fullAppVersion"
          }
          Write-Host "Packaging Koinly Windows installer version $appVersionName from pubspec version $fullAppVersion"
          $iss = @"
          #define SourceDir "$sourceDir"
          #define OutputDir "$outputDir"
          #define IconFile "$iconFile"
          #define MyAppName "Koinly"
          #define MyAppVersion "$appVersionName"
          #define MyAppExeName "Koinly.exe"

          [Setup]
          AppId={{D0F34749-64D8-4B0E-BBA3-026F8B4392C8}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=Koinly
          DefaultDirName={localappdata}\Programs\Koinly
          DefaultGroupName={#MyAppName}
          DisableWelcomePage=no
          DisableDirPage=no
          DisableProgramGroupPage=no
          DisableReadyPage=no
          DisableFinishedPage=no
          OutputDir={#OutputDir}
          OutputBaseFilename=KoinlySetup
          SetupIconFile={#IconFile}
          UninstallDisplayIcon={app}\{#MyAppExeName}
          VersionInfoDescription=Koinly Installer
          VersionInfoProductName=Koinly
          VersionInfoCompany=Koinly
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked

          [Files]
          Source: "{#SourceDir}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; IconFilename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; IconFilename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch {#MyAppName}"; Flags: nowait postinstall skipifsilent
          "@
          $iss = ($iss -split "`r?`n" | ForEach-Object { $_.TrimStart() }) -join "`r`n"
          Set-Content -Path "artifacts/koinly-installer.iss" -Value $iss -Encoding UTF8
          & "$env:ISCC_PATH" "artifacts/koinly-installer.iss"
          if (!(Test-Path "artifacts/KoinlySetup.exe")) {
            throw "Installer was not created: artifacts/KoinlySetup.exe"
          }
          Get-ChildItem artifacts | Format-Table Name,Length

      - name: Sign Windows installer if certificate is configured
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ($env:WINDOWS_SIGNING_ENABLED -ne "true") {
            Write-Host "Skipping Windows installer signing because WINDOWS_CODESIGN_PFX_BASE64 is not configured."
          } else {
            $installer = (Resolve-Path "artifacts/KoinlySetup.exe").Path
            & "$env:WINDOWS_SIGNTOOL_PATH" sign /f "$env:WINDOWS_CODESIGN_CERT" /p "$env:WINDOWS_CODESIGN_PASSWORD" /fd SHA256 /tr "$env:WINDOWS_CODESIGN_TIMESTAMP_URL" /td SHA256 "$installer"
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign KoinlySetup.exe" }

            & "$env:WINDOWS_SIGNTOOL_PATH" verify /pa /v "$installer"
            if ($LASTEXITCODE -ne 0) { throw "KoinlySetup.exe signature verification failed" }
          }
          Copy-Item -Path "artifacts/KoinlySetup.exe" -Destination "artifacts/Koinly-v$env:KOINLY_APP_VERSION_NAME-Setup.exe" -Force

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: koinly-windows-installer
          path: artifacts/Koinly-v*-Setup.exe
          if-no-files-found: error
          compression-level: 0


  build-linux:
    name: Build Linux ${{ matrix.arch }} AppImage and portable archive
    if: github.repository == 'Chowdhury-Siam/Koinly'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            appimage_arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux desktop build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config patchelf desktop-file-utils imagemagick \
            libgtk-3-dev liblzma-dev libsecret-1-dev libsqlite3-dev libnotify-dev libjsoncpp-dev

      - name: Set up Flutter on Linux x64
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Set up Flutter on Linux ARM64
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$RUNNER_TEMP/flutter-sdk"
          rm -rf "$FLUTTER_ROOT"
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" --version
          "$FLUTTER_ROOT/bin/flutter" precache --linux

      - name: Restore Linux dependency cache
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            build/linux
          key: koinly-${{ runner.os }}-${{ matrix.arch }}-deps-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            koinly-${{ runner.os }}-${{ matrix.arch }}-deps-

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - name: Generate Linux platform files
        run: flutter create --platforms=linux --project-name koinly --no-pub .

      - name: Apply Koinly Linux branding
        shell: bash
        run: |
          set -euo pipefail
          runner_file="linux/runner/my_application.cc"
          test -f "$runner_file"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('linux/runner/my_application.cc')
          text = path.read_text()
          text = text.replace('gtk_window_set_title(window, "koinly")', 'gtk_window_set_title(window, "Koinly")')
          text = text.replace('gtk_header_bar_set_title(header_bar, "koinly")', 'gtk_header_bar_set_title(header_bar, "Koinly")')
          path.write_text(text)
          PY

      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          VERSION_NAME="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION##*+}"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pubspec.yaml version: $FULL_VERSION"
            exit 1
          fi
          echo "KOINLY_APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "KOINLY_APP_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux release
        shell: bash
        run: |
          set -euo pipefail
          flutter build linux --release --no-pub \
            --dart-define=KOINLY_APP_VERSION="$KOINLY_APP_VERSION_NAME"

      - name: Package portable Linux archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          BUNDLE_DIR="$(find build/linux -type d -path '*/release/bundle' -print -quit)"
          if [ -z "$BUNDLE_DIR" ] || [ ! -x "$BUNDLE_DIR/koinly" ]; then
            echo "::error::Linux release bundle was not found."
            find build/linux -maxdepth 6 -type f -print || true
            exit 1
          fi
          tar -C "$BUNDLE_DIR" -czf "artifacts/Koinly-v${KOINLY_APP_VERSION_NAME}-linux-${{ matrix.arch }}.tar.gz" .
          echo "KOINLY_LINUX_BUNDLE=$BUNDLE_DIR" >> "$GITHUB_ENV"

      - name: Package broad-distro AppImage
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$RUNNER_TEMP/Koinly.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/lib/koinly" "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp -a "$KOINLY_LINUX_BUNDLE"/. "$APPDIR/usr/lib/koinly/"
          ln -s ../lib/koinly/koinly "$APPDIR/usr/bin/koinly"
          cp tools/linux/koinly.desktop "$APPDIR/usr/share/applications/koinly.desktop"
          ICON_PATH="$APPDIR/usr/share/icons/hicolor/512x512/apps/koinly.png"
          convert assets/icons/app_icon.png -resize 512x512! "$ICON_PATH"
          ICON_SIZE="$(identify -format '%wx%h' "$ICON_PATH")"
          if [ "$ICON_SIZE" != "512x512" ]; then
            echo "::error::AppImage icon must be exactly 512x512, got $ICON_SIZE."
            exit 1
          fi

          cat > "$APPDIR/AppRun" <<'EOF_APPRUN'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/lib/koinly/lib:${LD_LIBRARY_PATH:-}"
          export XDG_DATA_DIRS="$HERE/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          exec "$HERE/usr/lib/koinly/koinly" "$@"
          EOF_APPRUN
          chmod +x "$APPDIR/AppRun"
          ln -sf usr/share/icons/hicolor/512x512/apps/koinly.png "$APPDIR/koinly.png"
          cp tools/linux/koinly.desktop "$APPDIR/koinly.desktop"

          LINUXDEPLOY="$RUNNER_TEMP/linuxdeploy-${{ matrix.appimage_arch }}.AppImage"
          curl --fail --location --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage_arch }}.AppImage" \
            --output "$LINUXDEPLOY"
          chmod +x "$LINUXDEPLOY"
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$LINUXDEPLOY" \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/lib/koinly/koinly" \
            --desktop-file "$APPDIR/usr/share/applications/koinly.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/512x512/apps/koinly.png" \
            --output appimage

          GENERATED="$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy-*' -print -quit)"
          if [ -z "$GENERATED" ]; then
            echo "::error::linuxdeploy completed but no AppImage was produced."
            exit 1
          fi
          mv "$GENERATED" "artifacts/Koinly-v${KOINLY_APP_VERSION_NAME}-linux-${{ matrix.arch }}.AppImage"
          chmod +x "artifacts/Koinly-v${KOINLY_APP_VERSION_NAME}-linux-${{ matrix.arch }}.AppImage"
          ls -lh artifacts

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: koinly-linux-${{ matrix.arch }}
          path: |
            artifacts/Koinly-v*-linux-${{ matrix.arch }}.AppImage
            artifacts/Koinly-v*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: Build macOS universal DMG and app archive
    if: github.repository == 'Chowdhury-Siam/Koinly'
    # Apple Silicon is substantially faster for Flutter/Xcode release compilation than
    # the legacy Intel image. Flutter release builds remain universal when the ARM64-only
    # feature is disabled, so this single job still emits both arm64 and x86_64 slices.
    runs-on: macos-15
    permissions:
      contents: read
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      FLUTTER_VERSION: "3.47.4"
      FLUTTER_SDK_DIR: ${{ github.workspace }}/.ci-cache/flutter-macos-arm64
      # Release builds are explicitly universal so one package supports Intel and Apple Silicon.
      FLUTTER_MACOS_ARM64_ONLY: "false"
      COCOAPODS_DISABLE_STATS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore pinned Flutter SDK cache
        id: flutter-sdk-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/flutter-macos-arm64
          key: koinly-flutter-${{ runner.os }}-${{ runner.arch }}-3.47.4-v1

      - name: Set up pinned Flutter on Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$FLUTTER_SDK_DIR/bin/flutter" ]; then
            rm -rf "$FLUTTER_SDK_DIR"
            mkdir -p "$(dirname "$FLUTTER_SDK_DIR")"
            git clone --filter=blob:none --single-branch --depth 1 \
              --branch "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_SDK_DIR"
          fi
          echo "FLUTTER_ROOT=$FLUTTER_SDK_DIR" >> "$GITHUB_ENV"
          echo "$FLUTTER_SDK_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_SDK_DIR/bin/flutter" config --no-analytics
          if [ "${{ steps.flutter-sdk-cache.outputs.cache-hit }}" != "true" ]; then
            "$FLUTTER_SDK_DIR/bin/flutter" precache --macos
          fi
          "$FLUTTER_SDK_DIR/bin/flutter" --version

      - name: Enable macOS desktop support
        run: |
          flutter config --enable-macos-desktop
          flutter config --no-enable-macos-arm64-only || true

      - name: Generate macOS platform files
        run: flutter create --platforms=macos --project-name koinly --org com.koinly --no-pub .

      - name: Restore macOS dependency and incremental build caches
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            ~/Library/Caches/CocoaPods
            macos/Pods
            build/macos
          key: koinly-macos-arm64-build-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            koinly-macos-arm64-build-${{ hashFiles('pubspec.lock') }}-
            koinly-macos-arm64-build-

      - name: Show Flutter version
        run: flutter --version

      - name: Apply Koinly macOS identity, permissions, and icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYMAC'
          from pathlib import Path
          import plistlib

          config = Path('macos/Runner/Configs/AppInfo.xcconfig')
          text = config.read_text()
          replacements = {
              'PRODUCT_NAME = koinly': 'PRODUCT_NAME = Koinly',
              'PRODUCT_BUNDLE_IDENTIFIER = com.koinly.koinly': 'PRODUCT_BUNDLE_IDENTIFIER = com.koinly.siam',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if 'PRODUCT_BUNDLE_IDENTIFIER = com.koinly.siam' not in text:
              lines = []
              found = False
              for line in text.splitlines():
                  if line.startswith('PRODUCT_BUNDLE_IDENTIFIER ='):
                      line = 'PRODUCT_BUNDLE_IDENTIFIER = com.koinly.siam'
                      found = True
                  lines.append(line)
              if not found:
                  lines.append('PRODUCT_BUNDLE_IDENTIFIER = com.koinly.siam')
              text = '\n'.join(lines) + '\n'
          config.write_text(text)

          for name in ('DebugProfile.entitlements', 'Release.entitlements'):
              path = Path('macos/Runner') / name
              with path.open('rb') as handle:
                  data = plistlib.load(handle)
              data['com.apple.security.app-sandbox'] = True
              data['com.apple.security.network.client'] = True
              data['com.apple.security.files.user-selected.read-write'] = True
              with path.open('wb') as handle:
                  plistlib.dump(data, handle, sort_keys=False)
          PYMAC

          ICONSET="macos/Runner/Assets.xcassets/AppIcon.appiconset"
          test -d "$ICONSET"
          python3 - <<'PYICON'
          import json
          import subprocess
          from pathlib import Path

          source = Path('assets/icons/app_icon.png')
          iconset = Path('macos/Runner/Assets.xcassets/AppIcon.appiconset')
          contents = json.loads((iconset / 'Contents.json').read_text())
          generated = set()
          for item in contents.get('images', []):
              filename = item.get('filename')
              logical_size = item.get('size', '').split('x', 1)[0]
              scale = item.get('scale', '1x').rstrip('x')
              if not filename or not logical_size:
                  continue
              pixels = int(round(float(logical_size) * float(scale or '1')))
              target = iconset / filename
              subprocess.run(
                  ['sips', '-s', 'format', 'png', '-z', str(pixels), str(pixels), str(source), '--out', str(target)],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              generated.add(filename)
          if not generated:
              raise SystemExit('No macOS AppIcon images were generated from Contents.json')
          print('Generated macOS icons:', ', '.join(sorted(generated)))
          PYICON

      - name: Read app version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          VERSION_NAME="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION##*+}"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pubspec.yaml version: $FULL_VERSION"
            exit 1
          fi
          echo "KOINLY_APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "KOINLY_APP_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build universal macOS release
        run: |
          flutter build macos --release --no-pub \
            --dart-define=KOINLY_APP_VERSION="$KOINLY_APP_VERSION_NAME"

      - name: Verify Intel and Apple Silicon slices
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::macOS .app bundle was not found."
            exit 1
          fi
          MAIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          MAIN_BINARY="$APP_PATH/Contents/MacOS/$MAIN_EXECUTABLE"
          ARCHES="$(lipo -archs "$MAIN_BINARY")"
          echo "Koinly macOS architectures: $ARCHES"
          case " $ARCHES " in *" arm64 "*) ;; *) echo "::error::macOS build is missing arm64."; exit 1;; esac
          case " $ARCHES " in *" x86_64 "*) ;; *) echo "::error::macOS build is missing x86_64."; exit 1;; esac
          echo "KOINLY_MACOS_APP=$APP_PATH" >> "$GITHUB_ENV"

      - name: Prepare optional Developer ID signing
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP_PATH="$KOINLY_MACOS_APP"

          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ]; then
            echo "::warning::MACOS_CERTIFICATE_BASE64 is not configured. The DMG will be distributed without Developer ID notarization."
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::MACOS_CERTIFICATE_PASSWORD is required when MACOS_CERTIFICATE_BASE64 is configured."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/koinly-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/koinly-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          export CERT_PATH
          python3 - <<'PYCERT'
          import base64
          import os
          from pathlib import Path

          raw = os.environ['MACOS_CERTIFICATE_BASE64'].strip()
          Path(os.environ['CERT_PATH']).write_bytes(base64.b64decode(raw, validate=True))
          PYCERT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          IDENTITY="${MACOS_SIGNING_IDENTITY:-}"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity was found in the imported certificate."
            exit 1
          fi
          echo "Signing macOS app with: $IDENTITY"
          codesign --deep --force --options runtime --timestamp --sign "$IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"

      - name: Notarize signed macOS app when credentials are configured
        if: env.MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::warning::Apple notarization credentials are incomplete. The signed macOS packages will be published without notarization."
            echo "MACOS_NOTARIZED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          NOTARY_ARCHIVE="$RUNNER_TEMP/Koinly-notarization-universal.zip"
          rm -f "$NOTARY_ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent "$KOINLY_MACOS_APP" "$NOTARY_ARCHIVE"
          xcrun notarytool submit "$NOTARY_ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$KOINLY_MACOS_APP"
          xcrun stapler validate "$KOINLY_MACOS_APP"
          echo "MACOS_NOTARIZED=true" >> "$GITHUB_ENV"

      - name: Package macOS universal DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          STAGE="$RUNNER_TEMP/koinly-dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "$KOINLY_MACOS_APP" "$STAGE/Koinly.app"
          ln -s /Applications "$STAGE/Applications"
          DMG="artifacts/Koinly-v${KOINLY_APP_VERSION_NAME}-macos-universal.dmg"
          hdiutil create -volname "Koinly" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          ditto -c -k --sequesterRsrc --keepParent "$KOINLY_MACOS_APP" \
            "artifacts/Koinly-v${KOINLY_APP_VERSION_NAME}-macos-universal.zip"
          ls -lh artifacts

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: koinly-macos-universal
          path: |
            artifacts/Koinly-v*-macos-universal.dmg
            artifacts/Koinly-v*-macos-universal.zip
          if-no-files-found: error
          compression-level: 0

  publish-stable-release:
    name: Publish stable GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-apks
      - build-windows
      - build-linux
      - build-macos
    if: >-
      github.repository == 'Chowdhury-Siam/Koinly' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download APK artifacts
        uses: actions/download-artifact@v5
        with:
          name: koinly-android-release-assets
          path: release-assets

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v5
        with:
          name: koinly-windows-installer
          path: release-assets

      - name: Download Linux release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: koinly-linux-*
          path: release-assets
          merge-multiple: true

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: koinly-macos-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Publish versioned stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FULL_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          VERSION_NAME="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION##*+}"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pubspec.yaml version: $FULL_VERSION"
            exit 1
          fi
          RELEASE_TAG="v${VERSION_NAME}"
          RELEASE_TITLE="Koinly Stable ${VERSION_NAME}"

          # Prefer a real version section when it exists. Otherwise, fall back
          # to only the first/current bullet in each top
          # Unreleased category and stop before archived development history.
          awk -v version="${VERSION_NAME}" '
            BEGIN { capture=0; found=0 }
            /^##[[:space:]]+\[?v?[0-9]+\.[0-9]+\.[0-9]+\]?/ {
              if (capture) exit
              if ($0 ~ version) { capture=1; found=1; next }
            }
            /^##[[:space:]]+/ && capture { exit }
            capture { print }
          ' CHANGELOG.md > release-notes-body.md

          if [ ! -s release-notes-body.md ]; then
            awk '
              BEGIN { capture=0; in_section=0; emitted_any=0; emitted_in_section=0 }
              /^##[[:space:]]+Unreleased/ { capture=1; next }
              /^##[[:space:]]+/ && capture { exit }
              /^###[[:space:]]+Previous development history/ && capture { exit }
              capture && /^###[[:space:]]+/ {
                if (emitted_any) print ""
                print
                print ""
                in_section=1
                emitted_in_section=0
                next
              }
              capture && in_section && /^[[:space:]]*-[[:space:]]+/ && !emitted_in_section {
                print
                emitted_in_section=1
                emitted_any=1
                next
              }
            ' CHANGELOG.md > release-notes-body.md
          fi

          awk 'NF { seen=1 } seen { print }' release-notes-body.md > release-notes-trimmed.md
          mv release-notes-trimmed.md release-notes-body.md
          if [ ! -s release-notes-body.md ]; then
            {
              echo "### Changed"
              echo
              echo "- Stable Koinly ${VERSION_NAME} maintenance update."
            } > release-notes-body.md
          fi
          cp release-notes-body.md release-notes.md

          VERSION_NAME="$VERSION_NAME" RELEASE_TAG="$RELEASE_TAG" RELEASE_TITLE="$RELEASE_TITLE" python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          release_assets = pathlib.Path("release-assets")
          notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
          version_name = os.environ["VERSION_NAME"]
          release_tag = os.environ["RELEASE_TAG"]
          release_title = os.environ["RELEASE_TITLE"]
          repository = os.environ["GITHUB_REPOSITORY"]
          content_types = {
              ".apk": "application/vnd.android.package-archive",
              ".exe": "application/vnd.microsoft.portable-executable",
              ".dmg": "application/x-apple-diskimage",
              ".appimage": "application/octet-stream",
              ".gz": "application/gzip",
              ".zip": "application/zip",
          }

          assets = []
          for path in sorted(release_assets.iterdir()):
              if not path.is_file() or path.name == "koinly-update.json":
                  continue
              assets.append({
                  "id": 0,
                  "name": path.name,
                  "size": path.stat().st_size,
                  "browser_download_url": f"https://github.com/{repository}/releases/download/{release_tag}/{path.name}",
                  "content_type": content_types.get(path.suffix.lower(), "application/octet-stream"),
              })

          published_at = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          manifest = {
              "id": 0,
              "tag_name": release_tag,
              "name": release_title,
              "body": notes,
              "html_url": f"https://github.com/{repository}/releases/tag/{release_tag}",
              "draft": False,
              "prerelease": False,
              "published_at": published_at,
              "assets": assets,
          }
          manifest_path = release_assets / "koinly-update.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {manifest_path} for Koinly {version_name} with {len(assets)} release assets.")
          PY

          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag "${RELEASE_TAG}" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md \
              --latest
          fi
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f draft=false -f prerelease=false -f make_latest=true
