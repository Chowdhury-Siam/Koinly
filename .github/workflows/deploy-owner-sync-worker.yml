name: Deploy Owner Default Sync Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "cloud/worker/**"
      - ".github/workflows/deploy-owner-sync-worker.yml"

jobs:
  deploy:
    if: github.repository == 'Chowdhury-Siam/Koinly'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check owner deployment secrets
        run: |
          missing=0
          for secret_name in CLOUDFLARE_NAME CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN JWT_SECRET TELEGRAM_BOT_TOKEN REGISTRATION_KEY_CHAT_ID REGISTRATION_ADMIN_SECRET; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing GitHub secret: ${secret_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Create the missing owner secrets in GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! [[ "$CLOUDFLARE_NAME" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "CLOUDFLARE_NAME must be 1-63 lowercase letters, numbers, or dashes, and cannot start or end with a dash."
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "JWT_SECRET must contain at least 32 characters."
            exit 1
          fi
          if [ "${#REGISTRATION_ADMIN_SECRET}" -lt 32 ]; then
            echo "REGISTRATION_ADMIN_SECRET must contain at least 32 characters."
            exit 1
          fi
          if [ "$JWT_SECRET" = "$REGISTRATION_ADMIN_SECRET" ]; then
            echo "JWT_SECRET and REGISTRATION_ADMIN_SECRET must be different values."
            exit 1
          fi
          if ! [[ "$TURSO_DATABASE_URL" =~ ^libsql://[^/?[:space:]]+\.turso\.io/?$ ]]; then
            echo "::error::TURSO_DATABASE_URL must be the libsql:// URL returned by 'turso db show <database> --url'."
            exit 1
          fi
          if ! [[ "$TELEGRAM_BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo "TELEGRAM_BOT_TOKEN is not a valid Telegram bot token."
            exit 1
          fi
          if ! [[ "$REGISTRATION_KEY_CHAT_ID" =~ ^-?[0-9]+$ ]]; then
            echo "REGISTRATION_KEY_CHAT_ID must be a numeric Telegram chat ID."
            exit 1
          fi
          echo "All owner deployment secrets are present."
        env:
          CLOUDFLARE_NAME: ${{ secrets.CLOUDFLARE_NAME || vars.CLOUDFLARE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REGISTRATION_KEY_CHAT_ID: ${{ secrets.REGISTRATION_KEY_CHAT_ID }}
          REGISTRATION_ADMIN_SECRET: ${{ secrets.REGISTRATION_ADMIN_SECRET }}

      - name: Apply owner Turso schema
        run: npm run schema:apply
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Deploy owner Worker
        run: |
          deploy_output="$RUNNER_TEMP/wrangler-output.jsonl"
          trap 'rm -f .owner-worker-secrets "$deploy_output"' EXIT
          umask 077
          {
            printf 'TURSO_DATABASE_URL=%s\n' "$TURSO_DATABASE_URL"
            printf 'TURSO_AUTH_TOKEN=%s\n' "$TURSO_AUTH_TOKEN"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'REGISTRATION_KEY_CHAT_ID=%s\n' "$REGISTRATION_KEY_CHAT_ID"
            printf 'REGISTRATION_ADMIN_SECRET=%s\n' "$REGISTRATION_ADMIN_SECRET"
          } > .owner-worker-secrets
          export WRANGLER_OUTPUT_FILE_PATH="$deploy_output"
          npx wrangler deploy --name "$CLOUDFLARE_NAME" --secrets-file .owner-worker-secrets

          if [ ! -s "$deploy_output" ]; then
            echo "::error::Wrangler deployed the owner Worker but did not create its structured deployment report."
            exit 1
          fi
          worker_url="$(jq -sr '[.[] | select(.type == "deploy") | .targets[]? | select(type == "string" and startswith("https://"))] | last // empty' "$deploy_output")"
          if [ -z "$worker_url" ]; then
            echo "::error::Wrangler deployed the owner Worker but did not report a public target URL. Confirm workers_dev = true and enable the account's workers.dev subdomain."
            exit 1
          fi
          echo "WORKER_URL=$worker_url" >> "$GITHUB_ENV"
          echo "Deployed owner Worker URL: $worker_url"
        env:
          CLOUDFLARE_NAME: ${{ secrets.CLOUDFLARE_NAME || vars.CLOUDFLARE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REGISTRATION_KEY_CHAT_ID: ${{ secrets.REGISTRATION_KEY_CHAT_ID }}
          REGISTRATION_ADMIN_SECRET: ${{ secrets.REGISTRATION_ADMIN_SECRET }}

      - name: Check owner Worker health
        run: |
          health_file="$RUNNER_TEMP/koinly-owner-worker-health"
          http_status=""
          curl_exit=0
          for attempt in {1..18}; do
            set +e
            http_status="$(curl --silent --show-error --location \
              --retry 2 --retry-delay 3 --retry-all-errors \
              --output "$health_file" --write-out '%{http_code}' \
              "$WORKER_URL/health")"
            curl_exit=$?
            set -e
            if [ "$curl_exit" -eq 0 ]; then
              break
            fi
            echo "Health check attempt $attempt failed with curl exit $curl_exit. Waiting for workers.dev TLS and route propagation..."
            sleep 10
          done
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Could not reach $WORKER_URL/health after waiting for workers.dev TLS and route propagation."
            exit "$curl_exit"
          fi

          if ! jq -e 'type == "object"' "$health_file" >/dev/null 2>&1; then
            echo "::error::The owner Worker returned a non-JSON health response (HTTP $http_status)."
            head -c 1200 "$health_file"
            echo
            exit 1
          fi
          if ! jq -e '.service == "koinly-sync" and .ok == true and .databaseReachable == true and .schemaReady == true and .registrationMode == "invite-key"' "$health_file" >/dev/null; then
            echo "::error::The owner Worker is reachable but not healthy or invite-key registration is not enabled (HTTP $http_status)."
            jq -c . "$health_file"
            exit 1
          fi

      - name: Ensure owner registration key exists
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -X POST "$WORKER_URL/v1/admin/registration-key/bootstrap" \
            -H "Authorization: Bearer $REGISTRATION_ADMIN_SECRET" \
            -H "Accept: application/json" >/dev/null
        env:
          REGISTRATION_ADMIN_SECRET: ${{ secrets.REGISTRATION_ADMIN_SECRET }}

      - name: Check owner registration key delivery
        run: |
          retried=0
          for attempt in {1..10}; do
            status="$(curl --fail --silent --show-error \
              "$WORKER_URL/v1/admin/registration-key/status" \
              -H "Authorization: Bearer $REGISTRATION_ADMIN_SECRET" \
              -H "Accept: application/json")"
            delivery="$(jq -r '.key.deliveryStatus // "MISSING"' <<<"$status")"
            if [ "$delivery" = "DELIVERED" ]; then
              echo "Registration key delivered successfully."
              echo "### Owner Default Cloud Sync" >> "$GITHUB_STEP_SUMMARY"
              echo "Worker URL: \`$WORKER_URL\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$delivery" = "FAILED" ]; then
              if [ "$retried" -eq 0 ]; then
                echo "Retrying registration key delivery once."
                curl --fail --silent --show-error \
                  -X POST "$WORKER_URL/v1/admin/registration-key/retry-delivery" \
                  -H "Authorization: Bearer $REGISTRATION_ADMIN_SECRET" \
                  -H "Accept: application/json" >/dev/null
                retried=1
                continue
              fi
              delivery_error="$(jq -r '.key.deliveryError // "unknown error"' <<<"$status")"
              echo "::error::Registration key delivery failed: $delivery_error"
              exit 1
            fi
            sleep 3
          done
          echo "::error::Registration key delivery did not finish within 30 seconds. Check TELEGRAM_BOT_TOKEN and REGISTRATION_KEY_CHAT_ID."
          exit 1
        env:
          REGISTRATION_ADMIN_SECRET: ${{ secrets.REGISTRATION_ADMIN_SECRET }}
