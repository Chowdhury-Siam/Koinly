name: Deploy Self-Hosted Sync Worker

on:
  workflow_dispatch:
  # Forks are the self-hosted deployment surface. Run on every push to the
  # fork's default release branches so app-only updates can still redeploy a
  # Worker whose API contract changed. The job-level guard below keeps
  # canonical-repository pushes from deploying a user Worker.
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.repository != 'Chowdhury-Siam/Koinly'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check self-hosted deployment secrets
        run: |
          missing=0
          for secret_name in CLOUDFLARE_NAME CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURSO_DATABASE_URL TURSO_AUTH_TOKEN JWT_SECRET ADMIN_USERNAME ADMIN_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing GitHub Actions value: ${secret_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Create the missing values in GitHub repo Settings > Secrets and variables > Actions. CLOUDFLARE_NAME may be a repository variable; the other values should be repository secrets."
            exit 1
          fi
          if ! [[ "$CLOUDFLARE_NAME" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "CLOUDFLARE_NAME must be 1-63 lowercase letters, numbers, or dashes, and cannot start or end with a dash."
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "JWT_SECRET must contain at least 32 characters."
            exit 1
          fi
          node --experimental-transform-types scripts/prepare-secrets.mjs --check
          if ! [[ "$TURSO_DATABASE_URL" =~ ^libsql://[^/?[:space:]]+\.turso\.io/?$ ]]; then
            echo "::error::TURSO_DATABASE_URL must be the libsql://...turso.io Database URL shown in your Turso database Overview > Connect section. Do not use a workers.dev URL or the app.turso.tech browser URL."
            exit 1
          fi
          echo "All deployment secrets are present."
          echo "If deploy later fails with authentication code 10000, recreate CLOUDFLARE_API_TOKEN using Cloudflare's Edit Cloudflare Workers token template."
          echo "Use Cloudflare's Edit Cloudflare Workers template. It supplies Workers Routes Write, Workers Scripts Write, Workers KV Storage Write, Workers Tail Read, Workers R2 Storage Write, Account Settings Read, User Details Read, and User Memberships Read."
        env:
          CLOUDFLARE_NAME: ${{ secrets.CLOUDFLARE_NAME || vars.CLOUDFLARE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Apply Turso schema
        run: npm run schema:apply
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Deploy self-hosted Worker
        run: |
          deploy_output="$RUNNER_TEMP/wrangler-output.jsonl"
          trap 'rm -f .worker-secrets.json "$deploy_output"' EXIT
          umask 077
          node --experimental-transform-types scripts/prepare-secrets.mjs > .worker-secrets.json
          unset ADMIN_PASSWORD
          export WRANGLER_OUTPUT_FILE_PATH="$deploy_output"
          npx wrangler deploy --config wrangler.self-hosted.toml --name "$CLOUDFLARE_NAME" --secrets-file .worker-secrets.json

          if [ ! -s "$deploy_output" ]; then
            echo "::error::Wrangler deployed the Worker but did not create its structured deployment report."
            exit 1
          fi
          worker_url="$(jq -sr '[.[] | select(.type == "deploy") | .targets[]? | select(type == "string" and startswith("https://"))] | last // empty' "$deploy_output")"
          if [ -z "$worker_url" ]; then
            echo "::error::Wrangler deployed the Worker but did not report a public target URL. Confirm workers_dev = true and enable the account's workers.dev subdomain."
            exit 1
          fi
          echo "WORKER_URL=$worker_url" >> "$GITHUB_ENV"
          echo "Deployed Worker URL: $worker_url"
        env:
          CLOUDFLARE_NAME: ${{ secrets.CLOUDFLARE_NAME || vars.CLOUDFLARE_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Check self-hosted Worker health
        run: |
          health_file="$RUNNER_TEMP/koinly-worker-health"
          http_status=""
          curl_exit=0
          health_ready=0

          # workers.dev can briefly serve the previous deployment while the new
          # script propagates. A transport-successful HTTP 200 therefore is not
          # enough: keep polling until the *new Worker contract* is visible.
          for attempt in {1..18}; do
            rm -f "$health_file"
            set +e
            http_status="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --output "$health_file" --write-out '%{http_code}' \
              "$WORKER_URL/health")"
            curl_exit=$?
            set -e

            if [ "$curl_exit" -ne 0 ]; then
              echo "Health check attempt $attempt/18 could not reach the Worker (curl exit $curl_exit). Waiting for workers.dev TLS/route propagation..."
            elif ! jq -e 'type == "object"' "$health_file" >/dev/null 2>&1; then
              echo "Health check attempt $attempt/18 returned a non-JSON response (HTTP $http_status). Waiting for the new deployment..."
            elif jq -e '.service == "koinly-sync" and .ok == true and .databaseReachable == true and .schemaReady == true and .registrationMode == "first-user" and .telegramBackupAvailable == true and .realtimeSyncAvailable == true and .profileMediaSyncAvailable == true' "$health_file" >/dev/null; then
              health_ready=1
              break
            else
              echo "Health check attempt $attempt/18 reached a Worker, but the newly deployed capability contract is not ready yet (HTTP $http_status)."
              jq -c . "$health_file" || true
            fi

            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done

          if [ "$health_ready" -ne 1 ]; then
            if [ "$curl_exit" -ne 0 ]; then
              echo "::error::Could not reach $WORKER_URL/health after waiting for workers.dev TLS and route propagation."
              exit "$curl_exit"
            fi

            if ! jq -e 'type == "object"' "$health_file" >/dev/null 2>&1; then
              echo "::error::The deployed Worker still returns a non-JSON health response (HTTP $http_status)."
              head -c 1200 "$health_file" || true
              echo
              if grep -q 'error code: 1042' "$health_file"; then
                echo "::error::Cloudflare 1042 blocked a Worker loop. Confirm TURSO_DATABASE_URL is a libsql://*.turso.io URL, not a workers.dev URL, and remove any same-account proxy route in front of this Worker."
              fi
              exit 1
            fi

            echo "::error::The deployed Worker never exposed the required current sync/backup/profile-media capability contract (HTTP $http_status). This can mean Cloudflare is still serving an older deployment or the deployed source is outdated."
            echo "::error::Expected profileMediaSyncAvailable=true together with a healthy database/schema, realtime sync, Telegram backup, and first-user registration."
            jq -c . "$health_file"
            exit 1
          fi

          echo "### Self-hosted Cloud Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker URL: \`$WORKER_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker health check passed with the current capability contract: $WORKER_URL"
